name: Deploy architecture diagram

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/deploy-architecture-pages.yml
      - docs/findata-architecture.html
      - README.md
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare architecture site
        run: |
          mkdir -p _site/docs
          cp docs/findata-architecture.html _site/index.html
          cp docs/findata-architecture.html _site/docs/findata-architecture.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
